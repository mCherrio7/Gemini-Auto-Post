name: Run Daily AI Posting Agent

on:
  schedule:
    - cron: '0 13 * * *' # Fires automatically every single day at 9:00 AM EST (13:00 UTC)
  workflow_dispatch: # Allows manual button click triggering anytime

jobs:
  run-agents:
    runs-on: ubuntu-latest

    permissions:
      contents: write # CRITICAL FIX: Forces GitHub to grant the script permission to upload images

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4.2.2
      with:
        token: ${{ secrets.GITHUB_TOKEN }} # Explicitly uses the system's secure runtime pass

    - name: Install uv (Python Package Manager)
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

    - name: Set up Python sandbox environment
      run: uv venv --python 3.12

    - name: Install software dependencies
      run: uv pip install -r requirements.txt

    - name: Execute AI Crew and Broadcast Posts
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: uv run python app.py

    - name: Commit and Save Fresh Image to Repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add post_image.jpg social_media_posts.txt
        git commit -m "Automated Sync: Save fresh daily AI news assets" || echo "No changes to commit"
        git push origin main
