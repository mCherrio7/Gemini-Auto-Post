name: Run Daily AI Posting Agent

on:
  schedule:
    - cron: '0 13 * * *' # Fires automatically every single day at 9:00 AM EST (13:00 UTC)
  workflow_dispatch: # Allows manual button click triggering anytime

jobs:
  run-agents:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4.2.2 # Upgraded to support modern Node 24 runners cleanly

    - name: Install uv (Python Package Manager)
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # Locked to the official secure release hash

    - name: Set up Python sandbox environment
      run: uv venv --python 3.12

    - name: Install software dependencies
      run: uv pip install -r requirements.txt # Runs cleanly through uv directly (No manual path activation required!)

    - name: Execute AI Crew and Broadcast Posts
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: uv run python app.py # Uses uv's native runner to execute the code with absolute admin permissions
